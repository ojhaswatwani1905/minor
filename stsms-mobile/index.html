<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STSMS Tourist Safety Mobile App - Step 6 Completed</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 500: '#0284c7', 600: '#0284c7' } }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05080E; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Mobile Frame Container -->
  <div class="w-full max-w-sm h-[780px] bg-[#0B0F17] border-4 border-slate-800 rounded-[40px] shadow-2xl overflow-hidden flex flex-col relative">
    
    <!-- Mobile Status Bar Notch -->
    <div class="h-6 bg-slate-950 flex items-center justify-between px-6 text-[10px] text-slate-400 font-bold border-b border-slate-900 flex-shrink-0">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <span class="text-cyan-400 font-mono" id="network-pill">GPS • 5G</span>
        <span>100%</span>
      </div>
    </div>

    <!-- App Viewport -->
    <div id="mobile-app" class="flex-1 overflow-y-auto p-4 custom-scrollbar"></div>
  </div>

  <script>
    let user = null;
    let activeTrip = null;
    let screen = 'login'; // login, register, forgot, home, profile, create_trip, trip_detail, trip_list, live_map, notifications, safety_sensors, settings, history, reports
    let trips = [
      { id: 'trp_301', destination: 'Rohtang High Altitude Pass (3,978m)', route: 'Manali Base -> Solang -> Rohtang Summit', returnTime: 'Today, 18:00', radius: '5.0', guardian: 'Rohan Nair', phone: '+91 98765 43210', status: 'Active' },
      { id: 'trp_302', destination: 'Valley of Flowers River Track', route: 'Govindghat -> Ghangaria -> Valley Corridor', returnTime: 'Tomorrow, 17:00', radius: '4.0', guardian: 'Priya Nair', phone: '+91 98111 22233', status: 'Completed' }
    ];
    let selectedTripId = null;

    // STEP 5: Safety Monitoring State
    let inactivityMins = 0;
    let isCheckInOpen = false;
    let geofenceViolated = false;
    let isOfflineMode = false;
    let fallDetected = false;

    // STEP 4: Emergency Modal state
    let isSosModalOpen = false;
    let sosCountdown = 5;
    let isSilentSos = false;
    let isVoiceSos = false;
    let sosTimerInterval = null;
    let sosDispatched = false;

    // STEP 3: Live GPS Telemetry state
    let lat = 30.7280;
    let lng = 79.6053;
    let speed = 3.8;
    let battery = 88;
    let lastPingTime = new Date().toLocaleTimeString();

    // Background Inactivity Simulator Loop
    setInterval(() => {
      if (user) {
        inactivityMins += 2;
        if (inactivityMins >= 16 && !isCheckInOpen) {
          isCheckInOpen = true;
          render();
        }
      }
    }, 8000);

    // Background GPS Loop
    setInterval(() => {
      lat += (Math.random() - 0.5) * 0.0008;
      lng += (Math.random() - 0.5) * 0.0008;
      speed = +(Math.random() * 2 + 3).toFixed(1);
      lastPingTime = new Date().toLocaleTimeString();

      if (user && (screen === 'home' || screen === 'live_map')) {
        const pingEl = document.getElementById('last-ping-lbl');
        if (pingEl) pingEl.innerText = lastPingTime;

        const speedEl = document.getElementById('speed-lbl');
        if (speedEl) speedEl.innerText = speed + ' km/h';

        if (!isOfflineMode) {
          try {
            fetch('http://localhost:5001/api/monitoring/location-update', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userId: 'usr_102', lat, lng, speedKmH: speed, batteryLevel: battery })
            });
          } catch(e) {}
        }
      }
    }, 6000);

    function triggerFallDetection() {
      fallDetected = true;
      alert('🚨 G-SHOCK SENSOR: 3.4g Vertical Impact Shock Fall Detected!');
      try { fetch('http://localhost:5001/api/alerts/simulate', { method: 'POST' }); } catch(e) {}
      render();
    }

    function triggerGeofenceBreach() {
      geofenceViolated = true;
      alert('⚠️ GEOFENCE PERIMETER: Passed 5.0km Safety Boundary!');
      render();
    }

    function toggleOffline() {
      isOfflineMode = !isOfflineMode;
      document.getElementById('network-pill').innerText = isOfflineMode ? 'OFFLINE • SMS' : 'GPS • 5G';
      alert(isOfflineMode ? '📡 Switched to Offline Mode (Telemetry queued locally)' : '⚡ Switched to Online 5G Satellite Mesh');
      render();
    }

    function openSosModal() {
      isSosModalOpen = true;
      sosCountdown = 5;
      sosDispatched = false;
      isSilentSos = false;
      isVoiceSos = false;

      if (sosTimerInterval) clearInterval(sosTimerInterval);
      sosTimerInterval = setInterval(() => {
        if (sosCountdown > 1) {
          sosCountdown--;
          render();
        } else {
          clearInterval(sosTimerInterval);
          confirmFinalSos();
        }
      }, 1000);

      render();
    }

    function confirmFinalSos() {
      sosDispatched = true;
      if (sosTimerInterval) clearInterval(sosTimerInterval);
      render();

      alert('🚨 1-TAP EMERGENCY SOS DISTRESS BEACON SENT TO COMMAND CENTER!');
      try { fetch('http://localhost:5001/api/alerts/simulate', { method: 'POST' }); } catch(e) {}
    }

    function cancelSosModal() {
      if (sosTimerInterval) clearInterval(sosTimerInterval);
      isSosModalOpen = false;
      sosDispatched = false;
      render();
    }

    function render() {
      const root = document.getElementById('mobile-app');
      
      if (!user) {
        if (screen === 'register') {
          root.innerHTML = `
            <div class="space-y-4 text-white text-xs">
              <button onclick="screen='login'; render()" class="text-cyan-400 font-bold">← Back to Sign In</button>
              <h2 class="text-xl font-extrabold">Register Tourist Profile</h2>
              <form onsubmit="handleReg(event)" class="space-y-3 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                <div>
                  <label class="block text-slate-400 font-bold mb-1">Full Name</label>
                  <input id="reg-name" required class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white" placeholder="Priya Nair">
                </div>
                <div>
                  <label class="block text-slate-400 font-bold mb-1">Email</label>
                  <input id="reg-email" type="email" required class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white" placeholder="priya@example.com">
                </div>
                <div>
                  <label class="block text-slate-400 font-bold mb-1">Guardian Phone</label>
                  <input id="reg-phone" required class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white" placeholder="+91 98765 43210">
                </div>
                <div>
                  <label class="block text-slate-400 font-bold mb-1">Password</label>
                  <input id="reg-pass" type="password" required class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-3 bg-cyan-600 rounded-xl font-bold text-white shadow">Register & Connect GPS</button>
              </form>
            </div>
          `;
          return;
        }

        if (screen === 'forgot') {
          root.innerHTML = `
            <div class="space-y-4 text-white text-xs">
              <button onclick="screen='login'; render()" class="text-cyan-400 font-bold">← Back to Sign In</button>
              <h2 class="text-xl font-extrabold">Reset Password</h2>
              <form onsubmit="alert('Reset email sent!'); screen='login'; render()" class="space-y-3 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                <div>
                  <label class="block text-slate-400 font-bold mb-1">Registered Email</label>
                  <input type="email" required class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white" placeholder="tourist@stsms.gov">
                </div>
                <button type="submit" class="w-full py-3 bg-cyan-600 rounded-xl font-bold text-white shadow">Send Reset Link</button>
              </form>
            </div>
          `;
          return;
        }

        root.innerHTML = `
          <div class="space-y-5 text-white text-xs pt-4">
            <div class="text-center space-y-2">
              <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 mx-auto flex items-center justify-center font-black text-xl shadow-lg">S</div>
              <h1 class="text-xl font-extrabold">STSMS Tourist Safety</h1>
              <p class="text-[11px] text-slate-400">Android Traveler Companion App</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-3 bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-xl">
              <div>
                <label class="block text-slate-400 font-bold mb-1">Email</label>
                <input id="log-email" value="admin@stsms.gov" required class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white">
              </div>
              <div>
                <label class="block text-slate-400 font-bold mb-1">Password</label>
                <input id="log-pass" type="password" value="Admin@123" required class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white">
              </div>
              <div class="text-right">
                <button type="button" onclick="screen='forgot'; render()" class="text-cyan-400 font-bold text-[11px]">Forgot Password?</button>
              </div>
              <button type="submit" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 rounded-xl font-bold text-white shadow">Sign In to Mobile Portal</button>
            </form>

            <p class="text-center text-slate-400 text-[11px]">
              New traveler? <button onclick="screen='register'; render()" class="text-cyan-400 font-bold">Create Account</button>
            </p>
          </div>
        `;
        return;
      }

      // STEP 6: Settings Screen
      if (screen === 'settings') {
        root.innerHTML = `
          <div class="space-y-4 text-white text-xs pb-12">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
              <h2 class="font-extrabold text-sm">App Settings</h2>
              <button onclick="screen='home'; render()" class="text-cyan-400 font-bold">← Home</button>
            </div>

            <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
              <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <span>Theme Mode</span>
                <span class="text-cyan-400 font-bold">Dark Command</span>
              </div>
              <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <span>Check-In Timer</span>
                <span class="text-cyan-400 font-bold">15 Mins</span>
              </div>
              <div class="flex items-center justify-between">
                <span>GPS Sensitivity</span>
                <span class="text-cyan-400 font-bold">High Precision</span>
              </div>
            </div>
            <button onclick="alert('Settings saved!'); screen='home'; render()" class="w-full py-2.5 bg-cyan-600 rounded-xl font-bold text-white">Save Preferences</button>
          </div>
        `;
        return;
      }

      // STEP 6: History Screen
      if (screen === 'history') {
        root.innerHTML = `
          <div class="space-y-4 text-white text-xs pb-12">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
              <h2 class="font-extrabold text-sm">Expedition History</h2>
              <button onclick="screen='home'; render()" class="text-cyan-400 font-bold">← Home</button>
            </div>

            <div class="space-y-2">
              <div class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 space-y-1">
                <p class="font-extrabold text-white">Rohtang Pass Expedition</p>
                <p class="text-[11px] text-slate-400">14.2 km • Max Altitude: 3,978 m • 3 Pins Cleared</p>
              </div>
              <div class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 space-y-1">
                <p class="font-extrabold text-white">Valley of Flowers Track</p>
                <p class="text-[11px] text-slate-400">18.6 km • Max Altitude: 3,600 m • 4 Pins Cleared</p>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // STEP 6: Safety Reports Screen
      if (screen === 'reports') {
        root.innerHTML = `
          <div class="space-y-4 text-white text-xs pb-12">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
              <h2 class="font-extrabold text-sm">Safety Incident Reports</h2>
              <button onclick="screen='home'; render()" class="text-cyan-400 font-bold">← Home</button>
            </div>

            <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
              <span class="px-2 py-0.5 rounded text-[9px] font-bold bg-cyan-500/20 text-cyan-400">AI Risk Score: 92/100</span>
              <h3 class="font-extrabold text-sm text-white">Rohtang Expedition Clearance</h3>
              <p class="text-[11px] text-slate-400">All 3 checkpoints cleared. Guardian SMS verified.</p>
              <button onclick="alert('📄 PDF Safety Report Saved!');" class="w-full py-2.5 bg-cyan-600 rounded-xl font-bold text-white">📄 Export PDF Briefing Report</button>
            </div>
          </div>
        `;
        return;
      }

      // Default Home Screen with STEP 6 Links
      let content = `
        <div class="space-y-4 text-white text-xs pb-12">
          <div class="flex items-center justify-between border-b border-slate-800 pb-2">
            <div>
              <h2 class="font-extrabold text-sm">Welcome, ${user.name}</h2>
              <p class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                ${isOfflineMode ? 'Offline Mode (Local Log)' : 'GPS Satellite Mesh Active'}
              </p>
            </div>
            <button onclick="screen='notifications'; render()" class="px-2.5 py-1 bg-slate-800 rounded-lg text-cyan-400 font-bold">🔔 Logs</button>
          </div>

          <!-- STEP 4: Large SOS Button -->
          <div class="text-center py-2 space-y-2">
            <button onclick="openSosModal()" class="w-28 h-28 rounded-full bg-gradient-to-tr from-red-600 to-rose-500 border-4 border-red-400/40 text-white font-black text-2xl shadow-xl mx-auto flex flex-col items-center justify-center animate-pulse cursor-pointer">
              <span>SOS</span>
              <span class="text-[9px] font-bold text-red-200">1-TAP ALERT</span>
            </button>
            <p class="text-[10px] text-slate-400">Press for 1-Tap Distress Beacon & Countdown</p>
          </div>

          <!-- STEP 6 Quick Action Grid -->
          <div class="grid grid-cols-3 gap-2 text-center text-[10px] font-bold">
            <div onclick="screen='settings'; render()" class="p-2.5 bg-slate-900 border border-slate-800 rounded-xl cursor-pointer hover:border-cyan-500/40">⚙️ Settings</div>
            <div onclick="screen='history'; render()" class="p-2.5 bg-slate-900 border border-slate-800 rounded-xl cursor-pointer hover:border-cyan-500/40">📜 History</div>
            <div onclick="screen='reports'; render()" class="p-2.5 bg-slate-900 border border-slate-800 rounded-xl cursor-pointer hover:border-cyan-500/40">📄 Reports</div>
          </div>

          <!-- Active Trip Status Card -->
          <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-2">
            <div class="flex items-center justify-between">
              <span class="font-bold text-cyan-400 text-[11px]">${activeTrip ? 'ACTIVE EXPEDITION' : 'NO ACTIVE EXPEDITION'}</span>
              <span class="w-2 h-2 rounded-full ${activeTrip ? 'bg-emerald-400 animate-pulse' : 'bg-slate-600'}"></span>
            </div>
            <h3 class="font-extrabold text-sm">${activeTrip ? activeTrip.destination : 'Register expedition to start GPS tracking.'}</h3>
            
            <div class="grid grid-cols-2 gap-2 pt-1">
              <button onclick="screen='create_trip'; render()" class="py-2 bg-cyan-600 hover:bg-cyan-500 rounded-xl font-bold text-white text-xs">
                + Register Trip
              </button>
              <button onclick="screen='trip_list'; render()" class="py-2 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-slate-300 text-xs">
                View All Trips (${trips.length})
              </button>
            </div>
          </div>
        </div>
      `;

      root.innerHTML = content;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('log-email').value;
      user = { name: 'Priya Nair', email: email };
      screen = 'home';
      render();
    }

    async function handleReg(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      user = { name: name, email: email };
      screen = 'home';
      render();
    }

    window.onload = render;
  </script>
</body>
</html>
